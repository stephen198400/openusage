# Add inside an existing `server { listen ... ssl; }` block, replace TOKEN with the contents of
# /etc/openusage-probe/token, then `nginx -t && systemctl reload nginx`.
# The app requests https://<host>:<port>/openusage/traffic.json with `Authorization: Bearer <token>`.
location = /openusage/traffic.json {
    if ($http_authorization != "Bearer TOKEN") { return 401; }
    alias /var/lib/openusage-probe/traffic.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
}
